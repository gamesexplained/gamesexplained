name: kit-version
# Moves kit/VERSION on by one after a change lands on main that asks for it,
# so pull requests never edit the number and never conflict over it.
# A change asks with [kit-bump] in its pull request's title or body, a
# kit-bump label on the pull request, or [kit-bump] in a commit message (for
# a direct push). Lessons in kit/lessons/ headed "## next · ..." get the new
# number.
# It pushes as the repository's own GitHub App, which main's ruleset lets bypass
# the pull request rule; the Actions token cannot. The app's id is the
# repository variable KIT_BOT_APP_ID and its private key the secret
# KIT_BOT_PRIVATE_KEY. Its push starts ci.yml like any other, which deploys
# the site with the new number, and starts this workflow again, which the
# job's condition stops.
on:
  push:
    branches: [main]

permissions:
  contents: read         # the app's token pushes; this one only reads
  pull-requests: read    # read the merged pull request's title, body and labels

concurrency:
  group: kit-version
  cancel-in-progress: false

jobs:
  bump:
    # not for the app's own push of a bump
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did the change ask for a bump?
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          shas=$(git rev-list "$BEFORE..$AFTER" 2>/dev/null || echo "$AFTER")
          text=""
          for sha in $shas; do
            text+=$(git log -1 --format=%B "$sha")$'\n'
            text+=$(gh api "repos/$GH_REPO/commits/$sha/pulls" \
              --jq '.[] | .title + "\n" + (.body // "") + "\n" + ([.labels[].name | "[" + . + "]"] | join(" "))')$'\n'
          done
          if grep -qF '[kit-bump]' <<<"$text"; then
            echo "bump=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No [kit-bump] in this push."
          fi
      - name: The app's token
        if: steps.ask.outputs.bump == 'yes'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KIT_BOT_APP_ID }}
          private-key: ${{ secrets.KIT_BOT_PRIVATE_KEY }}
      - name: Bump kit/VERSION and number the new lessons
        if: steps.ask.outputs.bump == 'yes'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          uid=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${uid}+${SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          done=""
          for try in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            v=$(python3 -c "a = open('kit/VERSION').read().strip().split('.'); a[-1] = str(int(a[-1]) + 1); print('.'.join(a))")
            echo "$v" > kit/VERSION
            sed -i "s/^## next · /## $v · /" kit/lessons/*.md
            git commit -qam "kit $v"
            if git push -q origin HEAD:main; then done="$v"; break; fi
            sleep 5
          done
          [ -n "$done" ] || { echo "could not push the bump to main"; exit 1; }
          echo "kit/VERSION is $done"
