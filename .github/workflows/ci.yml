name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a day as well, so the activity page's periods move on (and count the issues closed)
  # on a day when nothing is merged.
  schedule:
    - cron: "17 6 * * *"

# A new push to a pull request cancels the older run of it: PR runs
# share a group (refs/pull/N/merge), so only the newest runs. Any
# other run gets a group of its own, so pushes to main, scheduled
# runs and manual runs neither cancel nor queue behind each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every kit test, on four computers at once. The tests are most of a run's time, and
  # each is a process of its own, so each computer takes a share of them: test_kit.py --shard
  # gives the Kth of N shares, which together are every test, each once
  # (kit/scripts/test_test_kit.py holds that). Another entry in `share` is another computer: the
  # number of shares is read from the list. A share that fails leaves the others running, so one
  # run names every failing test, and deploy waits for all of them.
  tests:
    name: tests (${{ matrix.share }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests of the tools that read git history have it to read
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # One convention for the kit's tests (#159): a file matching
      # `kit/**/test_*.py` (or `test_*.js`), or `test_*.py` in a game's own
      # folder, is a test, and this runs every one of them. A new test needs
      # no edit here. The older `--test`
      # self-tests on the tools are run by the same script, from a list at
      # the top of it. `--require-tools` makes a test that needs an installed
      # tool fail rather than skip, so CI cannot pass because an oracle was
      # absent: every share installs every oracle. See AGENTS.md, "Working on the kit or the site".
      - name: SkoolKit, the Z80 decoder's oracle in CI
        run: pip install skoolkit==10.1
      - name: jsbeeb, the BBC sound chip's oracle in CI
        run: python3 kit/scripts/tools.py --platform bbc get-jsbeeb
      - name: jsnes, the NES picture's palette oracle in CI
        run: python3 kit/scripts/tools.py --platform nes get-jsnes
      - name: Bocfel, the Z-machine decoder's oracle in CI
        run: python3 kit/scripts/tools.py get-bocfel
      # ScummVM takes a minute or two to build, so the folder it is built in is kept between
      # runs. The key changes with everything the build is made from: scummvm.py (the release,
      # the configure options, the edits), the kit's files compiled into it, and the runner's
      # image, whose compiler builds it and whose libraries it runs on. scummvm.py also keeps
      # a stamp of the first two in the folder and checks it before any use, so a build that is
      # out of date is built again below, and could only fail a test, never pass one.
      - name: The runner's image, for the key below, and its processor
        id: image
        run: |
          echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "$ImageOS-$ImageVersion, $(nproc) processors: $(lscpu | sed -n 's/^Model name: *//p')"
      - name: ScummVM's build, cached
        id: scummvm
        uses: actions/cache/restore@v4
        with:
          path: tools/scumm/scummvm-*/
          key: scummvm-build-${{ steps.image.outputs.version }}-${{ hashFiles('kit/scumm/scummvm.py', 'kit/scumm/scummvm_kit*') }}
      # ScummVM's source is 223 MB: kept between runs, so its site is asked for it once
      # for each change to the script that names the release.
      - name: ScummVM's source tarball, cached
        if: steps.scummvm.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: tools/scumm/scummvm-*.tar.xz
          key: scummvm-source-${{ hashFiles('kit/scumm/scummvm.py') }}
      - name: ScummVM, the SCUMM decoder's oracle in CI
        run: |
          if python3 -c "import sys; sys.path.insert(0, 'kit/scumm'); import scummvm; sys.exit(not scummvm.available())"; then
            echo "The build kept from an earlier run is up to date: $(python3 kit/scripts/tools.py scummvm status)"
          else
            python3 kit/scripts/tools.py get-scummvm
          fi
      - name: Keep ScummVM's build for the next run
        if: steps.scummvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/scumm/scummvm-*/
          key: ${{ steps.scummvm.outputs.cache-primary-key }}
      # How long each test took on an earlier run, so that the longest start first and none is
      # left to start when the rest are done (test_kit.py --times). It changes the order the
      # tests start in and nothing else. Runs on main keep the times; a pull request reads them.
      - name: Each test's time on an earlier run
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kit-test-times.json
          key: kit-test-times-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.share }}
          restore-keys: kit-test-times-
      - name: Every kit test, this computer's share
        id: tests
        run: >
          python3 kit/scripts/test_kit.py --require-tools
          --shard ${{ matrix.share }}/${{ strategy.job-total }}
          --times "$RUNNER_TEMP/kit-test-times.json"
      - name: Keep each test's time for the next run
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kit-test-times.json
          key: kit-test-times-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.share }}

  # The other checks, the site, and the checks of the built site in a browser, beside the tests.
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read   # the build reads which issues are closed, for the activity page
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # contributors are read from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Every kit script imports
        run: |
          for f in $(git ls-files 'kit/*.py' 'kit/**/*.py'); do
            dir=$(dirname "$f"); mod=$(basename "$f" .py)
            (cd "$dir" && python3 -c "import $mod") || exit 1
          done
      - name: No game binaries
        run: python3 kit/scripts/check_binaries.py
      - name: Knowledge in its place
        run: python3 kit/scripts/check_docs.py
      # kit/skills/core/80-retro, step 1: the passages a run names are found in the skills.
      - name: Skill text named in this pull request is found in the skills
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=d "$(git merge-base "origin/$BASE" HEAD)" -- 'games/*/*/kit-feedback.md')
          games=$(grep -l '^## Skill text that changed what I did' $files /dev/null | xargs -r -n1 dirname || true)
          if [ -z "$games" ]; then echo "No skill text named in this pull request."; exit 0; fi
          python3 kit/scripts/skill_usage.py --game $games
      - name: Listings match their symbols
        run: python3 kit/scripts/check_listing.py
      - name: Coverage figures reproduce
        run: |
          for g in games/*/*/; do
            echo "== $g"; python3 kit/scripts/coverage.py "$g" | head -3
          done
      # With the token, build.py asks GitHub which account an author's address
      # belongs to: a squash merge is authored under the account's primary
      # address, which nothing in the repository links to a login.
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 kit/scripts/build.py
      # The kit installs no browser driver, so CI installs playwright-core for the checks below and
      # uses the runner's Chrome.
      - name: Playwright for the browser checks
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0
      # Every button of every SID music player on the built site, played through the player's own
      # AudioWorklet: a page whose driver's writes match the game's can still be silent in the
      # browser (the volume the game sets at start-up left out, a name the worklet has not got).
      - name: Every music button sounds
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node kit/c64/sid_check.js _site --chromium "$(command -v google-chrome)"
      # Every game's browser check: a file in a game's folder whose name ends in -browser.js, which
      # presses real keys on the built page and watches what it draws (kit/scripts/play_browser.js).
      # A new one needs no edit here.
      - name: Every game's browser check
        run: |
          for f in $(git ls-files 'games/*-browser.js'); do
            echo "== $f"
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$f" _site --chromium "$(command -v google-chrome)" || exit 1
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy to GitHub Pages at https://gamesexplained.com. Runs on main when the
  # repository variable DEPLOY_PAGES is "true" (it is). The CNAME file is
  # written by kit/scripts/build.py.
  deploy:
    needs: [tests, check-and-build]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    # one deployment at a time
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      actions: read   # to list this workflow's runs, below
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs on main overlap, and an older one can finish its tests after a newer one has
      # deployed: deploying it then would take the newer one's changes off the site. Deploy jobs
      # run one at a time (the group above), so a run checks first whether a newer run's deploy
      # job has finished, and if one has, the site already holds this run's changes and it skips
      # its own deploy. A run that cannot ask deploys as before.
      - name: Has a newer run on main deployed?
        id: newer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          deploy=yes
          if ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&per_page=50" \
              --jq ".workflow_runs[] | select(.event != \"pull_request\" and .run_number > $RUN) | .id"); then
            for id in $ids; do
              if ! n=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                  --jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length'); then
                echo "::warning::Could not read run $id's jobs, so deploying as if it had not deployed."
              elif [ "$n" != 0 ]; then
                echo "Not deploying: newer run $id has deployed a site with this run's changes in it."
                deploy=no
                break
              fi
            done
          else
            echo "::warning::Could not list this workflow's runs, so deploying as if none were newer."
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.newer.outputs.deploy == 'yes'
        uses: actions/deploy-pages@v4

  # Post each newly added game to Discord once the site carrying it is live,
  # and each update a merged pull request lands on a game already there.
  announce:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Post newly added games to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret; nothing posted."; exit 0; fi
          git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'games/*/*/game.json' | while read -r gj; do
            python3 -c 'import json, sys
          g = json.load(open(sys.argv[1]))
          url = "https://gamesexplained.com/%s/%s/" % (g["platform"], g["slug"])
          print(json.dumps({"content": "New on Games Explained: **%s** (%s, %s) %s" % (g["title"], g["platform"], g["tier"], url),
                            "allowed_mentions": {"parse": []}}))' "$gj" > payload.json
            echo "Announcing $gj"
            curl -sSf -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK"
          done
      # The summary is the pull request's title, minus its game prefix;
      # kit/scripts/announce_updates.py holds the rules for staying silent.
      - name: Post updated games to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 kit/scripts/announce_updates.py
