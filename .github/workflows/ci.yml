name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # contributors are read from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # One convention for the kit's tests (#159): a file matching
      # `kit/**/test_*.py` (or `test_*.js`) is a test, and this runs every
      # one of them. A new test needs no edit here. The older `--test`
      # self-tests on the tools are run by the same script, from a list at
      # the top of it. `--require-tools` makes a test that needs an installed
      # tool fail rather than skip, so CI cannot pass because an oracle was
      # absent. See AGENTS.md, "Working on the kit or the site".
      - name: SkoolKit, the Z80 decoder's oracle in CI
        run: pip install skoolkit==10.1
      - name: Every kit test
        run: python3 kit/scripts/test_kit.py --require-tools
      - name: Every kit script imports
        run: |
          for f in $(git ls-files 'kit/*.py' 'kit/**/*.py'); do
            dir=$(dirname "$f"); mod=$(basename "$f" .py)
            (cd "$dir" && python3 -c "import $mod") || exit 1
          done
      - name: No game binaries
        run: python3 kit/scripts/check_binaries.py
      - name: Knowledge in its place
        run: python3 kit/scripts/check_docs.py
      # kit/skills/core/80-retro, step 1: the passages a run names are found in the skills.
      - name: Skill text named in this pull request is found in the skills
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=d "$(git merge-base "origin/$BASE" HEAD)" -- 'games/*/*/kit-feedback.md')
          games=$(grep -l '^## Skill text that changed what I did' $files /dev/null | xargs -r -n1 dirname || true)
          if [ -z "$games" ]; then echo "No skill text named in this pull request."; exit 0; fi
          python3 kit/scripts/skill_usage.py --game $games
      - name: Listings match their symbols
        run: python3 kit/scripts/check_listing.py
      - name: Coverage figures reproduce
        run: |
          for g in games/*/*/; do
            echo "== $g"; python3 kit/scripts/coverage.py "$g" | head -3
          done
      # With the token, build.py asks GitHub which account an author's address
      # belongs to: a squash merge is authored under the account's primary
      # address, which nothing in the repository links to a login.
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 kit/scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy to GitHub Pages at https://gamesexplained.com. Runs on main when the
  # repository variable DEPLOY_PAGES is "true" (it is). The CNAME file is
  # written by kit/scripts/build.py.
  deploy:
    needs: check-and-build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    # one deployment at a time: kit-version.yml starts this again after its bump
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Post each newly added game to Discord once the site carrying it is live.
  announce:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Post newly added games to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret; nothing posted."; exit 0; fi
          git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'games/*/*/game.json' | while read -r gj; do
            python3 -c 'import json, sys
          g = json.load(open(sys.argv[1]))
          url = "https://gamesexplained.com/%s/%s/" % (g["platform"], g["slug"])
          print(json.dumps({"content": "New on Games Explained: **%s** (%s, %s) %s" % (g["title"], g["platform"], g["tier"], url),
                            "allowed_mentions": {"parse": []}}))' "$gj" > payload.json
            echo "Announcing $gj"
            curl -sSf -H 'Content-Type: application/json' -d @payload.json "$WEBHOOK"
          done
