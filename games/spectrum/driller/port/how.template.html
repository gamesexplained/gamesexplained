<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#23262d; --paper:#e9e7e1; --surface:#ffffff; --surface-2:#f1efea; --line:#d5d3cc; --line-soft:#e0ded8;
  --ink:#2f3136; --ink-soft:#55585f; --ink-mute:#80838a;
  --link:#1f5fa8; --link-hover:#154480; --accent:#1f5fa8;
  --amber:#c25a00; --cyan:#1f5fa8; --coral:#d04a3a; --green:#2a8a4a; --violet:#4a5bd6; --hl:#fff0c2;
  --chip:#2f3136; --chip-ink:#ffffff;
  --fd:'Lato',system-ui,sans-serif; --fb:'Lato',system-ui,sans-serif; --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --col:1080px; --gx:68px; --fs:17px; --lh:1.6; --hw:900; --h1:46px; --h2:26px; --sy:48px; --pp:26px; --r:10px;
  --plate-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);max-width:var(--col);margin:0 auto;min-height:100vh;padding:0 0 4rem}
h1,h2,h3{font-weight:var(--hw);letter-spacing:-.01em;text-wrap:balance;color:var(--ink);margin:0}
.wrap{padding:0 var(--gx)}
.hero{padding:48px var(--gx) 8px;text-align:left}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 10px}
.hero h1{font-size:var(--h1);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px}
.hero .sub{margin:0 0 .6em;color:var(--ink-soft)}
section{padding:var(--sy) 0 24px}
section:last-of-type{border-bottom:none}
.fig{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 10px}
h2.t{font-size:var(--h2);margin-bottom:12px}
h3{font-size:19px;margin:22px 0 8px}
.lede{color:var(--ink-soft);margin:0 0 30px}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pp);box-shadow:var(--plate-shadow)}
.cap{font-size:14px;color:var(--ink-mute);margin-top:14px;line-height:1.55}
.cap b{color:var(--ink);font-weight:700}
code{font-family:var(--fm);font-size:.82em;background:var(--chip);color:var(--chip-ink);border-radius:4px;padding:2px 6px;white-space:nowrap}
kbd{font-family:var(--fm);font-size:.8em;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-weight:700;color:var(--ink-soft)}
/* the page's widgets */
.hw-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.hw-two>*{min-width:0}
@media (max-width:760px){.hw-two{grid-template-columns:1fr}:root{--gx:16px;--h1:34px}}
.hw-screen{background:#000;border-radius:6px;overflow:hidden;line-height:0}
.hw-screen canvas,.hw-plan canvas,.hw-wave canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.hw-plan canvas{border-radius:6px;border:1px solid var(--line);cursor:crosshair;touch-action:none}
.hw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:10px 0 0;font-family:var(--fm);font-size:13px;color:var(--ink-soft)}
.hw-row input[type=range]{flex:1;min-width:160px;accent-color:var(--ink)}
.hw-btn{font-family:var(--fm);font-size:12px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
.hw-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hw-btn:disabled{opacity:.4;cursor:default}
.hw-btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.hw-fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hw-fx button{font-family:var(--fb);font-size:13px;text-align:left;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;line-height:1.3}
.hw-fx button span{display:block;font-family:var(--fm);font-size:11px;color:var(--ink-mute)}
.hw-fx button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.hw-fx button[aria-pressed="true"] span{color:#c9c9c9}
.hw-wave{margin:14px 0 0}
.hw-out{font-size:15px;margin:10px 0 0;line-height:1.5}
.hw-out b{font-family:var(--fb)}
.hw-bytes{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 0;font-family:var(--fm);font-size:12px}
.hw-bytes span{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--surface-2);min-width:38px}
.hw-bytes span i{font-style:normal;font-family:var(--fb);font-weight:700;font-size:14px;color:var(--ink)}
.hw-q{font-size:22px;font-weight:900;margin:8px 0 0}
.hw-shots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.hw-shots img{width:100%;height:auto;image-rendering:pixelated;border-radius:6px;display:block}
.hw-amts{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 0;font-family:var(--fm);font-size:12px}
.hw-amts span{border:1px solid var(--line);border-radius:5px;padding:3px 4px;text-align:center;background:var(--surface-2);color:var(--ink-mute)}
.hw-amts span b{display:block;font-family:var(--fb);font-size:14px;color:var(--ink)}
.hw-amts span.on{background:var(--ink);color:#c9c9c9;border-color:var(--ink)}
.hw-amts span.on b{color:#fff}
.pl-list{padding-left:20px}
.pl-list li{margin:0 0 8px}
</style>
<!-- tabs -->
<header class="hero">
  <p class="eyebrow">{{platform}} · {{year}} · {{publisher}}</p>
  <h1>{{title}}</h1>
  <p class="sub"><!-- standfirst --></p>
</header>
<main class="wrap">
<!-- sections -->
</main>
<script src="../../lib/ay.js"></script>
<!-- port -->
