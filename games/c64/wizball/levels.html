<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}: maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#23262d; --paper:#e9e7e1; --surface:#ffffff; --surface-2:#f1efea; --line:#d5d3cc; --line-soft:#e0ded8;
  --ink:#2f3136; --ink-soft:#55585f; --ink-mute:#80838a; --link:#1f5fa8; --accent:#1f5fa8; --coral:#d04a3a;
  --chip:#2f3136; --chip-ink:#ffffff;
  --fb:'Lato',system-ui,sans-serif; --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --col:1080px; --gx:68px; --fs:17px; --lh:1.6; --hw:900; --h1:46px; --h2:26px; --pp:22px; --r:10px;
  --plate-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);max-width:var(--col);margin:0 auto;min-height:100vh;padding:0 0 4rem}
h1,h2{font-weight:var(--hw);letter-spacing:-.01em;margin:0}
.wrap{padding:0 var(--gx)}
.hero{padding:48px var(--gx) 8px}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 10px}
.hero h1{font-size:var(--h1);line-height:1.15;margin:0 0 14px}
.hero .sub{margin:0 0 .6em;color:var(--ink-soft)}
h2{font-size:22px;margin:34px 0 10px}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pp);box-shadow:var(--plate-shadow)}
.cap{font-size:14px;color:var(--ink-mute);margin-top:10px;line-height:1.55}
code{font-family:var(--fm);font-size:.82em;background:var(--chip);color:var(--chip-ink);border-radius:4px;padding:2px 6px;white-space:nowrap}
canvas{display:block;image-rendering:pixelated}
.scroller{overflow-x:auto;background:#000;border-radius:8px}
.btn{font-family:var(--fm);font-size:12.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;border:1px solid rgba(0,0,0,.25)}
.note{color:var(--coral)}
@media (max-width:760px){:root{--gx:18px;--pp:14px}}
</style>
<!-- tabs -->
<header class="hero">
  <p class="eyebrow">{{platform}} · {{year}} · {{publisher}}</p>
  <h1>{{title}}</h1>
  <p class="sub">Every landscape at full length, with the Wiz-lab and the picture after level 8, drawn from the map at <code>$0532</code>, the tiles at <code>$2642</code> and each level's glyph block.</p>
</header>
<main class="wrap">
  <p><button class="btn" id="col" aria-pressed="false">Colour them in</button></p>
  <p class="note" id="msg"></p>
  <div id="levels"></div>
</main>
<script>
// A landscape's characters, drawn from the map the way fetch_left_column $78CF does: four tile rows of
// the level's band, each tile 5 x 5 characters from $2642 + 25 x tile. ram is the game image.
// Levels 0-7 are the eight landscapes (45 tiles from column 0 or 45 of their band, from $B2F0);
// 8 is the Wiz-lab and 9 the finale, two 4-tile halves side by side (the $75DF jump).
function wizLandscape(ram, level) {
  const MAP = 0x0532, TILES = 0x2642;
  const parts = [];
  if (level < 8) {
    const rec = 0xB2F0 + 4 * level, row = ram[rec + 1], first = ram[rec] === 0xFF ? 0 : 45;
    parts.push({ row, col: first, n: 45 });
  } else if (level === 8) parts.push({ row: 8, col: 92, n: 4 }, { row: 12, col: 92, n: 4 });
  else parts.push({ row: 0, col: 92, n: 4 }, { row: 4, col: 92, n: 4 });
  const tilesW = parts.reduce((s, p) => s + p.n, 0), w = tilesW * 5, h = 20;
  const codes = new Uint8Array(w * h), tiles = new Int16Array(tilesW * 4);
  let tx = 0;
  for (const p of parts) for (let i = 0; i < p.n; i++, tx++) for (let r = 0; r < 4; r++) {
    const t = ram[MAP + 96 * (p.row + r) + p.col + i];
    tiles[r * tilesW + tx] = t;
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++)
      codes[(r * 5 + y) * w + tx * 5 + x] = ram[(TILES + 25 * t + 5 * y + x) & 0xFFFF];
  }
  const block = ram[0xB31C + 2 * level] | ram[0xB31D + 2 * level] << 8;   // the level's glyphs, copied to $FD00
  return { w, h, codes, tiles, tilesW, parts, block };
}
// The play character set $F800-$FFFF for a level: the loaded glyphs, the level's block at $FD00, and
// glyph $FF, which is the six hardware-vector bytes the initialisation copies from $B62D.
function wizCharset(ram, level) {
  const cs = new Uint8Array(2048);
  cs.set(ram.subarray(0xF800, 0xFD00), 0);
  const L = wizLandscape(ram, level);
  cs.set(ram.subarray(L.block, L.block + 760), 0x500);
  cs[0x7F8] = 0; cs[0x7F9] = 0; cs.set(ram.subarray(0xB62D, 0xB633), 0x7FA);
  return cs;
}
if (typeof module !== 'undefined' && module.exports) module.exports = { wizLandscape, wizCharset };

</script>
<script src="../../lib/c64.js"></script>
<script>
(function () {
  'use strict';
  const PAL = ['#000000', '#ffffff', '#813338', '#75cec8', '#8e3c97', '#56ac4d', '#2e2c9b', '#edf171',
               '#8e5029', '#553800', '#c46c71', '#4a4a4a', '#7b7b7b', '#a9ff9f', '#706deb', '#b2b2b2'];
  const NAMES = ['black', 'white', 'red', 'cyan', 'purple', 'green', 'blue', 'yellow', 'orange', 'brown', 'light red', 'dark grey', 'grey', 'light green', 'light blue', 'light grey'];
  const RGB = PAL.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
  const hex = (n, w) => '$' + n.toString(16).toUpperCase().padStart(w || 2, '0');
  const box = document.getElementById('levels');
  if (!window.C64) { document.getElementById('msg').textContent = 'These pictures read the game\'s bytes from listing.json, which the built site serves: open the page from the site, not from disk.'; return; }
  C64.load('listing.json').then(G => {
    const ram = G.ram, S = 2;
    const TITLES = ['Level 1', 'Level 2', 'Level 3', 'Level 4', 'Level 5', 'Level 6', 'Level 7', 'Level 8', 'The Wiz-lab', 'After level 8'];
    const cvs = [];
    for (let l = 0; l < 10; l++) {
      const L = wizLandscape(ram, l), p = L.parts;
      const h2 = document.createElement('h2'); h2.textContent = TITLES[l]; box.appendChild(h2);
      const plate = document.createElement('div'); plate.className = 'plate';
      const sc = document.createElement('div'); sc.className = 'scroller';
      const cv = document.createElement('canvas'); sc.appendChild(cv); plate.appendChild(sc);
      let cap = `Map rows ${p[0].row}-${p[0].row + 3}, columns ${p[0].col}-${p[0].col + p[0].n - 1}` +
        (p[1] ? `, then rows ${p[1].row}-${p[1].row + 3}, columns ${p[1].col}-${p[1].col + p[1].n - 1}` : '') + `; glyphs from <code>${hex(L.block, 4)}</code>.`;
      if (l < 8) {
        const c = [0, 1, 2].map(k => ram[0xB1D1 + 4 * l + k]);
        cap += ' Colours to make: ' + c.map(x => `<span class="sw" style="background:${PAL[x]}"></span> ${NAMES[x]}`).join(', ') +
          `. Alien shots every ${ram[0xA12A + l]} frames; the police after ${ram[0xA1B9 + l]} seconds without a kill.`;
      }
      if (l === 4) cap += ' The red box is the stray tile <code>$F8</code> at <code>$092B</code>.';
      if (l === 2) cap += ' The third row of tiles holds the three Mount Rushmores.';
      plate.insertAdjacentHTML('beforeend', `<p class="cap">${cap}</p>`);
      box.appendChild(plate);
      cvs.push({ cv, L, l, cs: wizCharset(ram, l) });
    }
    function draw(coloured) {
      for (const { cv, L, l, cs } of cvs) {
        const w = L.w * 8, h = L.h * 8, lc = l < 8 ? [0, 1, 2].map(k => ram[0xB1D1 + 4 * l + k]) : null;
        const cols = coloured && lc ? [0, lc[0], lc[1], lc[2] & 7] : [0, 11, 12, 1];
        const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
        const t = tmp.getContext('2d'), img = t.createImageData(w, h);
        for (let cy = 0; cy < L.h; cy++) for (let cx = 0; cx < L.w; cx++) {
          const code = L.codes[cy * L.w + cx];
          for (let py = 0; py < 8; py++) {
            const bits = code === 0 ? 0 : cs[code * 8 + py];
            for (let q4 = 0; q4 < 4; q4++) {
              const c = RGB[cols[(bits >> (6 - 2 * q4)) & 3]];
              for (let k = 0; k < 2; k++) { const i = 4 * ((cy * 8 + py) * w + cx * 8 + 2 * q4 + k); img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255; }
            }
          }
        }
        t.putImageData(img, 0, 0);
        cv.width = w * S; cv.height = h * S;
        const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.drawImage(tmp, 0, 0, w * S, h * S);
        for (let r = 0; r < 4; r++) for (let x = 0; x < L.tilesW; x++) if (L.tiles[r * L.tilesW + x] >= 192) {
          ctx.strokeStyle = '#ff2a2a'; ctx.lineWidth = 2; ctx.strokeRect(x * 40 * S + 1, r * 40 * S + 1, 40 * S - 2, 40 * S - 2);
        }
      }
    }
    const btn = document.getElementById('col');
    btn.onclick = () => { const on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', String(on)); draw(on); };
    draw(false);
  }).catch(e => { document.getElementById('msg').textContent = 'Could not read listing.json: ' + e.message; });
})();
</script>
