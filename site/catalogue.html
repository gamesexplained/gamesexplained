<div class="cathead"><h2>All games <span class="n" id="count">{{games}}</span></h2></div>
<div class="finder" id="finder" hidden>
  <div class="row">
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search {{games}}, publishers, people, ideas" aria-label="Search games" autocomplete="off"><kbd>/</kbd></label>
    <select id="sort" aria-label="Sort and group"><option value="tier">Most complete first</option><option value="az">A to Z</option><option value="year">By year</option><option value="new">Newest on the site</option></select>
    <div class="seg" role="group" aria-label="View"><button type="button" data-view="cards" aria-pressed="true">Cards</button><button type="button" data-view="list" aria-pressed="false">List</button></div>
    <button type="button" class="more" id="more" aria-expanded="false">Filters</button>
  </div>
  <div class="facets" id="facets" hidden></div>
</div>
<div id="catalogue"><div class="tiles">{{cards}}</div></div>
